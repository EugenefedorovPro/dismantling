name: Test and deploy Dismantling

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django and run tests
        env:
          DJANGO_DEBUG: "1"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
          python manage.py test

      - name: Check production deployment
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "local-ci-only-dismantling-container-test-key"
          WEB_PORT: "18088"
        run: |
          set -euo pipefail
          python -m unittest discover -s deploy
          export DISMANTLING_DATA_DIR="$RUNNER_TEMP/dismantling-data"
          mkdir -p "$DISMANTLING_DATA_DIR"
          compose=(docker compose -f docker-compose.yaml -f deploy/compose.production.yaml)
          trap '"${compose[@]}" down' EXIT
          "${compose[@]}" up -d --build --wait --wait-timeout 90
          test -s "$DISMANTLING_DATA_DIR/db.sqlite3"
          curl --fail --silent --show-error http://127.0.0.1:18088/ > /dev/null

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dismantle.rhyme.kyiv.ua
    timeout-minutes: 20
    concurrency:
      group: dismantling-production
      cancel-in-progress: false
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/dismantling_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy to kant VPS
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -T -i "$HOME/.ssh/dismantling_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            kant@176.117.78.212 python3 - "$GITHUB_SHA" < deploy/release.py
