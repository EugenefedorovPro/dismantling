name: Test and deploy Dismantling

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django and run tests
        env:
          DJANGO_DEBUG: "1"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
          python manage.py test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dismantle.rhyme.kyiv.ua
    timeout-minutes: 20
    concurrency:
      group: dismantling-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/dismantling_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy to kant VPS
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/dismantling_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            kant@176.117.78.212 'bash -se' <<'REMOTE'
          cd /opt/apps/dismantling
          set -euo pipefail
          if [ ! -f .env ] || ! grep -Eq '^DJANGO_DEBUG=0$' .env; then
            echo 'Production .env with DJANGO_DEBUG=0 is required.' >&2
            exit 1
          fi
          if ! grep -Eq '^DJANGO_SECRET_KEY=.{32,}$' .env ||
             grep -Eq '^DJANGO_SECRET_KEY=(django-insecure-|REPLACE_WITH_)' .env; then
            echo 'Set a unique long DJANGO_SECRET_KEY in the production .env.' >&2
            exit 1
          fi
          git fetch origin main
          git switch main
          git merge --ff-only FETCH_HEAD
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
          docker compose ps
          REMOTE
